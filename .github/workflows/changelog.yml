# Verifica que cada Pull Request actualice CHANGELOG.md.
# Para omitirlo en cambios triviales, agrega la etiqueta "sin-changelog" al Pull Request.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'sin-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar que CHANGELOG.md cambió
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md actualizado."
          else
            echo "::error file=CHANGELOG.md::Agrega una línea bajo '## [Sin publicar]' en CHANGELOG.md (ver CONTRIBUTING.md), o usa la etiqueta 'sin-changelog'."
            exit 1
          fi
